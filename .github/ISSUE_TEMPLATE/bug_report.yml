name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove code, repository names, tokens and other private data from logs and screenshots.
        Security issues go through **Security → Report a vulnerability**, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press New review…
        2. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you run Reviewer
      options:
        - Reviewer.app (installer or desktop:package)
        - Browser (npm start)
        - Development (npm run dev)
        - Demo (npm run demo)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, Reviewer commit or version, `node --version`, `gh --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The desktop app writes ~/Library/Application Support/Reviewer/server.log.
      render: text
